<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骨架动作对比 · Human24</title>
<style>
:root{color-scheme:light;--ink:#172c32;--muted:#536b70;--paper:#f2f4ee;--line:#cbd6d1;--soma:#76ddd0;--target:#ffb777;font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}main{max-width:1440px;margin:auto;padding:clamp(18px,3.5vw,55px)}h1{margin:0;font-weight:650;letter-spacing:-.045em;font-size:clamp(26px,3.6vw,49px)}
header,.tools,.transport,.legend,.modes,.step,.clipline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header,.tools{justify-content:space-between}header{margin-bottom:20px}.source-id,.mono,output{font:500 13px ui-monospace,"Courier New",monospace;font-variant-numeric:tabular-nums}.source-id{color:var(--muted);letter-spacing:.1em}
.tools{border-block:1px solid var(--line);padding:13px 0;margin:0 0 18px}button,select{font:inherit;color:inherit;cursor:pointer}button{border:1px solid var(--line);border-radius:6px;background:transparent;padding:7px 12px}button:hover,select:hover{border-color:#67867e}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #448a80;outline-offset:2px}
select{background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}label,.mode-label{font-size:13px;color:var(--muted)}.clipline select{font:500 13px ui-monospace,monospace;max-width:min(72vw,390px)}
.group{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:8px}.group button{border:0;padding:5px 12px;font-size:13px}.group button[aria-pressed=true]{background:#244540;color:white}
.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#253d45,#12272f 75%);border-radius:12px;color:#e9f4f2;}
.legend{justify-content:space-between;padding:14px 20px 0;gap:8px}.tag{font-size:14px;font-weight:650;display:inline-flex;align-items:center;gap:8px}.tag:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--soma)}.tag.target:before{background:var(--target)}.tag small{font-size:12px;color:#b0c3c4;font-weight:450}
.viewports{display:flex;position:relative}.pane{position:relative;width:50%;min-width:0}.pane+.pane{border-left:1px solid #47616a75}.pane-head{padding:18px 19px 0;height:46px}.pane canvas{display:block;width:100%;height:clamp(280px,50vh,570px);touch-action:none;cursor:grab}.pane canvas:active{cursor:grabbing}
.overlay .pane{width:100%}.overlay .second{display:none}.overlay .pane-head{display:none}.legend[hidden]{display:none}.overlay .pane canvas{margin-top:10px}.stagefoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 19px;color:#b3c5c8;border-top:1px solid #405760;font-size:12px}.stagefoot button{color:#e1ede9;border-color:#59716f;font-size:12px;padding:4px 9px}
.transport{margin-top:15px;gap:10px;flex-wrap:nowrap}.play{background:#244540;color:white;min-width:84px;border-color:#244540}.step{gap:4px;flex-wrap:nowrap}.step button{font-size:16px;padding:5px 9px}.timeline{flex:1;min-width:55px;accent-color:#267a6c}output{white-space:nowrap}.speed{font-size:13px;padding:6px}.readings{display:flex;gap:20px;justify-content:space-between;border-top:1px solid var(--line);margin-top:14px;padding-top:12px;color:var(--muted);font-size:13px;flex-wrap:wrap}.readings b{color:var(--ink)}
@media(max-width:700px){.pane-head{padding:12px 8px 0;height:38px}.tag{font-size:12px;gap:4px}.tag small{font-size:10px}.stagefoot{padding:9px}.transport{flex-wrap:wrap}.timeline{order:5;flex-basis:100%}.tools{gap:9px}.tag:before{width:7px;height:7px}.readings{gap:6px 15px}.source-id{font-size:10px}}
</style>
<main>
<header><h1>骨架动作对比</h1><span class="source-id">BONES SEED / HUMAN24</span></header>
<div class="tools">
  <label class="clipline">动作 <select id="clip"></select></label>
  <div class="modes">
    <div class="group" role="group" aria-label="显示方式"><button id="split" aria-pressed="true">并排</button><button id="overlay" aria-pressed="false">叠加</button></div>
    <div class="group" role="group" aria-label="坐标系"><button id="world" aria-pressed="true">世界坐标</button><button id="pelvis" aria-pressed="false">骨盆对齐</button></div>
  </div>
</div>
<section class="stage" id="stage" aria-label="同步三维骨架">
  <div class="legend" id="legend" hidden><span class="tag">SOMA <small>原始 · 77 关节</small></span><span class="tag target">Human24 <small>重定向 · 24 关节</small></span></div>
  <div class="viewports">
    <div class="pane"><div class="pane-head"><span class="tag">SOMA <small>原始 · 77 关节</small></span></div><canvas id="left" aria-label="SOMA 骨架或叠加视图"></canvas></div>
    <div class="pane second"><div class="pane-head"><span class="tag target">Human24 <small>重定向 · 24 关节</small></span></div><canvas id="right" aria-label="Human24 骨架"></canvas></div>
  </div>
  <div class="stagefoot"><span id="hint">地面 Y = 0 m · 网格 0.5 m</span><span>拖动旋转 · 滚轮缩放 <button id="reset">复位视角</button></span></div>
</section>
<div class="transport">
  <button class="play" id="play" aria-label="播放或暂停">▶ 播放</button>
  <div class="step"><button id="prev" title="上一帧（←）" aria-label="上一帧">←</button><button id="next" title="下一帧（→）" aria-label="下一帧">→</button></div>
  <input id="time" class="timeline" type="range" min="0" value="0" step="1" aria-label="选择帧">
  <output id="frame"></output>
  <select id="speed" class="speed" aria-label="播放速度"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
</div>
<div class="readings"><span id="timing"></span><span>骨盆离地高度　SOMA <b id="srcY" class="mono"></b>　Human24 <b id="dstY" class="mono"></b></span></div>
</main>
<script type="application/json" id="motion"><!--MOTION_DATA--></script>
<script>
"use strict";
const el = id => document.getElementById(id);
const clips = JSON.parse(el("motion").textContent);
const colors = ["#76ddd0","#ffb777"];
let sample, rigs, frame=0, running=false, overlay=false, aligned=false, startTime=0, startFrame=0;
let yaw=.2, pitch=.13, zoom=1, zoomExtent=1, centerY=1;
function unpack(rig) {
  const raw=atob(rig.xyz), bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
  return {names:rig.names,parents:rig.parents,data:new Float32Array(bytes.buffer)};
}
function point(rig,t,j) {
  const i=3*(t*rig.parents.length+j), a=rig.data;
  return [a[i],a[i+1],a[i+2]];
}
function framing() {
  let low=aligned?Infinity:0, high=-Infinity, radius=0;
  for(const rig of rigs) {
    const n=rig.parents.length;
    for(let t=0;t<sample.frames;t++) {
      const r=point(rig,t,0);
      for(let j=0;j<n;j++) {
        const i=3*(t*n+j), a=rig.data, y=a[i+1]-(aligned?r[1]:0);
        low=Math.min(low,y); high=Math.max(high,y);
        radius=Math.max(radius,Math.hypot(a[i]-r[0],a[i+2]-r[2]));
      }
    }
  }
  centerY=(low+high)/2;
  zoomExtent={height:Math.max(high-low,.6),width:Math.max(2*radius,.6)};
}
function choose(index) {
  sample=clips[index]; rigs=[unpack(sample.source),unpack(sample.target)];
  running=false; frame=0; el("time").max=sample.frames-1; framing(); render();
}
function segment(ctx,a,b,color,width) {
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath(); ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
}
function draw(canvas,which) {
  const box=canvas.getBoundingClientRect(), w=box.width,h=box.height;
  if(!w||!h)return;
  const dpr=Math.min(devicePixelRatio||1,2);
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)) {canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}
  const g=canvas.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);g.lineCap="round";
  const r0=point(rigs[0],frame,0),r1=point(rigs[1],frame,0);
  const anchor=aligned?[0,0,0]:[(r0[0]+r1[0])/2,0,(r0[2]+r1[2])/2];
  const scale=Math.min(h/(zoomExtent.height+.40),w/(zoomExtent.width+.32))*zoom;
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  function project(x,y,z) {
    x-=anchor[0]; y-=centerY; z-=anchor[2];
    const dx=cy*x-sy*z, dz=sy*x+cy*z;
    return [w/2+dx*scale,h/2-(cp*y-sp*dz)*scale,dz*cp+y*sp];
  }
  if(!aligned) {
    const bx=Math.floor(anchor[0]*2)/2,bz=Math.floor(anchor[2]*2)/2;
    for(let k=-8;k<=8;k++) {
      const x=bx+k/2,z=bz+k/2;
      segment(g,project(x,0,bz-4),project(x,0,bz+4),x===0?"#42646d":"#304953",.8);
      segment(g,project(bx-4,0,z),project(bx+4,0,z),z===0?"#42646d":"#304953",.8);
    }
  } else {
    segment(g,project(-.15,0,0),project(.15,0,0),"#668289",1);
    segment(g,project(0,-.12,0),project(0,.12,0),"#668289",1);
  }
  for(const side of which) {
    const rig=rigs[side], root=point(rig,frame,0), color=colors[side];
    const points=rig.parents.map((_,j)=>{
      const p=point(rig,frame,j);
      return aligned?project(p[0]-root[0],p[1]-root[1],p[2]-root[2]):project(...p);
    });
    const bones=rig.parents.map((parent,j)=>[parent,j]).filter(([p])=>p>=0);
    bones.sort(([a,b],[c,d])=>points[a][2]+points[b][2]-points[c][2]-points[d][2]);
    const unit=Math.max(.7,Math.min(1.5,scale/170));
    for(const [p,j] of bones) {
      const fine=side===0&&/Eye|Jaw|Thumb|Index|Middle|Ring|Pinky|End/.test(rig.names[j]);
      g.globalAlpha=overlay?(side===0?.72:.92):.96;
      segment(g,points[p],points[j],color,(fine?1.2:3.3)*unit);
      g.beginPath();g.arc(points[j][0],points[j][1],(fine?1:2.45)*unit,0,2*Math.PI);g.fillStyle=color;g.fill();
    }
    g.globalAlpha=1;g.beginPath();g.arc(points[0][0],points[0][1],5*unit,0,2*Math.PI);g.strokeStyle=color;g.lineWidth=2;g.stroke();
  }
}
function render() {
  draw(el("left"),overlay?[0,1]:[0]);if(!overlay)draw(el("right"),[1]);
  el("play").textContent=running?"Ⅱ 暂停":"▶ 播放";el("time").value=frame;
  el("frame").textContent=(frame+1)+" / "+sample.frames;
  el("timing").textContent=sample.fps+" FPS　·　"+(frame/sample.fps).toFixed(2)+" / "+((sample.frames-1)/sample.fps).toFixed(2)+" s";
  el("srcY").textContent=point(rigs[0],frame,0)[1].toFixed(3)+" m";el("dstY").textContent=point(rigs[1],frame,0)[1].toFixed(3)+" m";
}
function tick(now) {
  if(!running)return;
  const next=(startFrame+Math.floor(Math.max(0,now-startTime)*sample.fps*Number(el("speed").value)/1000))%sample.frames;
  if(next!==frame){frame=next;render();}
  animation=requestAnimationFrame(tick);
}
let animation=0;
function play() {
  running=!running;cancelAnimationFrame(animation);startTime=performance.now();startFrame=frame;
  if(running)animation=requestAnimationFrame(tick);render();
}
function seek(n) {running=false;cancelAnimationFrame(animation);frame=Math.min(sample.frames-1,Math.max(0,n));render();}
function setView(stacked,local) {
  overlay=stacked;aligned=local;el("stage").classList.toggle("overlay",overlay);el("legend").hidden=!overlay;
  for(const [id,on] of [["split",!overlay],["overlay",overlay],["world",!aligned],["pelvis",aligned]])el(id).setAttribute("aria-pressed",String(on));
  el("hint").textContent=aligned?"双骨盆重合 · 保留世界朝向":"地面 Y = 0 m · 网格 0.5 m";
  framing();render();
}
el("play").onclick=play;el("prev").onclick=()=>seek(frame-1);el("next").onclick=()=>seek(frame+1);
el("time").oninput=()=>seek(Number(el("time").value));
el("speed").onchange=()=>{startTime=performance.now();startFrame=frame;};
el("split").onclick=()=>setView(false,aligned);el("overlay").onclick=()=>setView(true,aligned);
el("world").onclick=()=>setView(overlay,false);el("pelvis").onclick=()=>setView(overlay,true);
el("reset").onclick=()=>{yaw=.2;pitch=.13;zoom=1;render();};
for(const canvas of [el("left"),el("right")]) {
  let drag=null;
  canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};
  canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-.9,Math.min(.9,pitch+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY];render();}};
  canvas.onlostpointercapture=()=>{drag=null;};
  canvas.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(.4,Math.min(3,zoom*Math.exp(-e.deltaY*.001)));render();},{passive:false});
}
document.addEventListener("keydown",e=>{
  if(["SELECT","INPUT","BUTTON"].includes(e.target.tagName))return;
  if(e.code==="Space"){e.preventDefault();play();}
  if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();seek(frame+(e.key==="ArrowLeft"?-1:1));}
});
clips.forEach((clip,i)=>el("clip").add(new Option(clip.id,String(i))));
el("clip").onchange=()=>{cancelAnimationFrame(animation);choose(Number(el("clip").value));};
window.addEventListener("resize",render);choose(0);
</script>
</html>
